services:
  backend:
    image: practice-backend:latest
    container_name: practice-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      CONNECTION_STRING: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/practice
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - practice-network

  postgres:
    image: postgres:17-bookworm
    container_name: practice-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: practice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - practice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practice"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  practice-network:
    external: true

volumes:
  postgres_data:
    external: true
    name: ab840ef54c4e56c6bc6bd32c1c5f56fd92c1033f9e9b25658a266cd617f98b12