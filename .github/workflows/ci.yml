name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: practice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d practice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: practice-backend

    env:
      CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/practice
      JWT_SECRET: ci-only-jwt-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      RESETOKEN_SECRET: ci-only-reset-secret
      CLIENT_URL: http://localhost:5173
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: practice-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        run: touch .env

      - name: Initialize database
        run: |
          node --env-file=.env -e '
            const { initDatabase } = require("./db-init/init");
            const { pool } = require("./config/db");

            initDatabase()
              .then(() => pool.end())
              .catch(async (error) => {
                console.error(error);
                await pool.end();
                process.exit(1);
              });
          '

      - name: Run tests
        run: npm test -- --run
      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm install -g vercel
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
